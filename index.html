<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALIES Al-Amin 2027: Olimpiade SD/MI Tingkat Nasional</title>
    <meta name="description" content="Ikuti ALIES Al-Amin 2027! Ajang olimpiade pelajar SD/MI bergengsi dari Al Amin Mojokerto. Asah potensi akademis dan raih prestasimu. Daftar sekarang!" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script>
      // Animasi pembuka: hanya sekali per kunjungan & dilewati jika "kurangi gerakan".
      // Pengaman: apa pun yang terjadi, halaman dibuka paksa setelah 6 detik.
      (function () {
        try {
          var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!reduced && !sessionStorage.getItem('alies-intro-seen')) {
            document.documentElement.classList.add('intro-playing');
            setTimeout(function () {
              document.documentElement.classList.remove('intro-playing');
              window.dispatchEvent(new Event('alies:intro-done'));
            }, 6000);
          }
        } catch (e) {}
      })();
    </script>
  </head>
